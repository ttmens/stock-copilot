<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>自选股管理 — 智策 NexStrat</title>
<link rel="stylesheet" href="../assets/theme.css">
<style>
.wl-shell { max-width: 800px; margin: 0 auto; padding: 88px 16px 100px; }
@media (max-width: 900px) { .wl-shell { padding: 72px 12px 96px; } }
@media (max-width: 480px) { .wl-shell { padding: 68px 10px 92px; } }

.wl-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
.wl-header h1 { font-size: 20px; font-weight: 700; color: var(--text-primary); margin: 0; }
.wl-stats { display: flex; gap: 8px; font-size: 12px; }
.wl-stat { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); padding: 4px 10px; border-radius: var(--r-full); color: var(--text-secondary); border: 1px solid var(--border-hair); }

/* Status dot */
.status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
.status-dot.online { background: var(--signal-bull); }
.status-dot.offline { background: var(--signal-bear); }

/* Add stock — wrap for positioning */
.input-wrap { position: relative; margin-bottom: 16px; }
.wl-add { display: flex; gap: 8px; flex-wrap: wrap; }
.wl-add input {
  flex: 1; min-width: 120px; min-height: var(--touch);
  padding: 0 14px; border-radius: var(--r-full);
  background: var(--canvas-alt); border: 1px solid var(--border-soft);
  color: var(--text-primary); font-size: 14px; font-family: var(--font-cn);
  outline: none; transition: border-color 0.15s ease;
}
.wl-add input:focus { border-color: var(--accent-cyan); }
.wl-add button {
  min-height: var(--touch); padding: 0 18px; border-radius: var(--r-full);
  border: none; background: var(--accent-purple); color: #fff; cursor: pointer;
  font-size: 13px; font-weight: 600; font-family: var(--font-cn); white-space: nowrap;
  transition: background 0.15s ease;
}
.wl-add button:hover { background: #6a2de0; }

/* Search results dropdown */
.search-results {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--border-soft);
  border-radius: var(--r-md); max-height: 220px; overflow-y: auto;
  z-index: var(--z-dropdown); display: none;
  box-shadow: var(--shadow-md);
}
.search-results .item {
  padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between;
  border-bottom: 1px solid var(--border-hair); transition: background 0.1s ease;
}
.search-results .item:last-child { border-bottom: none; }
.search-results .item:hover { background: var(--surface-hover); }
.search-results .item .code { font-family: var(--font-mono); color: var(--accent-cyan); font-weight: 600; font-size: 13px; }
.search-results .item .name { color: var(--text-secondary); font-size: 12px; }

/* Actions */
.wl-actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.wl-actions button {
  min-height: var(--touch); padding: 0 14px; border-radius: var(--r-full);
  border: none; cursor: pointer; font-size: 13px; font-weight: 600; font-family: var(--font-cn);
  transition: all 0.15s ease;
}
.wl-actions .analyze-btn { background: var(--accent-purple); color: #fff; }
.wl-actions .analyze-btn:hover { background: #6a2de0; }
.wl-actions .analyze-fast { background: rgba(255,255,255,0.08); color: var(--text-secondary); border: 1px solid var(--border-soft); }
.wl-actions .clear-btn { background: rgba(239,68,68,0.12); color: var(--signal-bear); border: 1px solid rgba(239,68,68,0.25); }

/* Job status */
.job-status { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--r-md); padding: 14px 16px; margin-bottom: 16px; display: none; }
.job-status.active { display: block; }
.job-status-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.job-status-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.job-status-pct { font-family: var(--font-mono); font-size: 13px; color: var(--accent-cyan); font-weight: 600; }
.job-bar { height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
.job-bar-fill { height: 100%; background: var(--accent-purple); border-radius: 3px; transition: width 0.3s ease; }
.job-msg { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

/* Table */
.wl-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.wl-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.wl-table th { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border-soft); color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
.wl-table td { padding: 10px 8px; border-bottom: 1px solid var(--border-hair); vertical-align: middle; }
.wl-table tr:hover td { background: var(--surface-hover); }
.wl-table .stock-code { font-family: var(--font-mono); color: var(--accent-cyan); font-weight: 600; }
.wl-table .stock-link { color: inherit; text-decoration: none; }
.wl-table .stock-link:hover { text-decoration: underline; }

.sentiment-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: var(--r-full); font-size: 11px; font-weight: 600; }
.sentiment-badge.bullish { background: rgba(34,197,94,0.15); color: var(--signal-bull); border: 1px solid rgba(34,197,94,0.3); }
.sentiment-badge.bearish { background: rgba(239,68,68,0.15); color: var(--signal-bear); border: 1px solid rgba(239,68,68,0.3); }
.sentiment-badge.neutral { background: rgba(148,163,184,0.12); color: var(--signal-hold); border: 1px solid rgba(148,163,184,0.2); }

.rm-btn { min-height: 32px; padding: 4px 10px; border-radius: var(--r-full); border: 1px solid rgba(239,68,68,0.25); background: transparent; color: var(--signal-bear); cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.15s ease; }
.rm-btn:hover { background: rgba(239,68,68,0.12); }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
.empty-state-icon { font-size: 32px; margin-bottom: 12px; }
.empty-state-text { font-size: 14px; margin-bottom: 4px; color: var(--text-secondary); }
.empty-state-sub { font-size: 12px; color: var(--text-faint); }
.empty-state button { margin-top: 16px; min-height: var(--touch); padding: 0 20px; border-radius: var(--r-full); border: none; background: var(--accent-purple); color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:32px;height:32px">
        <rect width="32" height="32" rx="8" fill="url(#logo-grad)"/>
        <path d="M8 22 L14 14 L18 18 L24 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 10 L24 10 L24 14" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="32" y2="32"><stop offset="0%" stop-color="#7b3ff2"/><stop offset="100%" stop-color="#00f5ff"/></linearGradient></defs>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">智策 NexStrat</span>
      <span class="brand-tagline">自选股管理</span>
    </div>
  </div>
  <div class="site-nav">
    <a href="../index.html">首页</a>
    <a href="../dashboard.html">看板</a>
    <a href="watchlist.html" class="active">自选</a>
    <a href="../history.html">历史</a>
  </div>
</header>

<div class="wl-shell">
  <div class="wl-header">
    <h1>自选股管理</h1>
    <div class="wl-stats">
      <span class="wl-stat"><span class="status-dot" id="status-dot"></span><span id="api-status">检测中...</span></span>
      <span class="wl-stat"><span id="wl-count">0</span> 只</span>
    </div>
  </div>

  <!-- Job Status -->
  <div class="job-status" id="job-status">
    <div class="job-status-head">
      <span class="job-status-title" id="job-title">分析中</span>
      <span class="job-status-pct" id="job-pct">0%</span>
    </div>
    <div class="job-bar"><div class="job-bar-fill" id="job-bar-fill" style="width:0%"></div></div>
    <div class="job-msg" id="job-msg"></div>
  </div>

  <!-- Add stock -->
  <div class="input-wrap">
    <div class="wl-add">
      <input name="code" id="input-code" placeholder="搜索代码或名称（如 600519 或 茅台）" autocomplete="off">
      <button type="button" id="btn-add">加入自选</button>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>

  <!-- Actions -->
  <div class="wl-actions" id="wl-actions" style="display:none">
    <button class="analyze-btn" id="btn-analyze">🔍 立即分析全部</button>
    <button class="analyze-fast" id="btn-analyze-fast">⚡ 快速分析</button>
    <button class="clear-btn" id="btn-clear">清空</button>
  </div>

  <!-- Watchlist table -->
  <div class="wl-table-wrap">
    <table class="wl-table" id="wl-table">
      <thead>
        <tr>
          <th>代码</th>
          <th>名称</th>
          <th>信号</th>
          <th>评分</th>
          <th style="width:60px">操作</th>
        </tr>
      </thead>
      <tbody id="wl-body"></tbody>
    </table>
  </div>
  <div id="empty-state" class="empty-state" style="display:none">
    <div class="empty-state-icon">📭</div>
    <div class="empty-state-text">暂无自选股</div>
    <div class="empty-state-sub">搜索上方输入框添加股票</div>
    <button type="button" id="btn-import">导入默认模板</button>
  </div>
  <div class="disclaimer">⚠️ 本报告仅供个人研究参考，不构成投资建议。报告内容基于公开数据和 AI 分析生成，可能存在错误或遗漏。股市有风险，决策需谨慎。</div>
</div>

</nav>

<script>
(function () {
  "use strict";

  // Auto-detect API
  let API = "";
  if (window.location.hostname !== "ttmens.github.io") {
    API = window.location.origin;
  }
  if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
    API = "http://127.0.0.1:8000";
  }

  const body = document.getElementById("wl-body");
  const emptyState = document.getElementById("empty-state");
  const tableWrap = document.querySelector(".wl-table-wrap");
  const actionsBar = document.getElementById("wl-actions");
  const statusDot = document.getElementById("status-dot");
  const apiStatus = document.getElementById("api-status");
  const wlCount = document.getElementById("wl-count");
  const searchInput = document.getElementById("input-code");
  const searchResults = document.getElementById("search-results");

  const STOCK_DB = {
    "600519":"贵州茅台","000858":"五粮液","000333":"美的集团","601318":"中国平安",
    "600036":"招商银行","600900":"长江电力","601166":"兴业银行","600276":"恒瑞医药",
    "300750":"宁德时代","000001":"平安银行","601398":"工商银行","600031":"三一重工",
    "601888":"中国中免","600585":"海螺水泥","002714":"牧原股份","600809":"山西汾酒",
    "600000":"浦发银行","601816":"京沪高铁","600887":"伊利股份","002304":"洋河股份",
    "600050":"中国联通","601919":"中远海控","600028":"中国石化","601288":"农业银行",
    "600941":"中国移动","601088":"中国神华","002594":"比亚迪","601668":"中国建筑",
    "000651":"格力电器","600104":"上汽集团","601628":"中国人寿","600030":"中信证券",
    "601012":"隆基绿能","300059":"东方财富","601336":"新华保险","000661":"长春高新",
    "600760":"中航沈飞","603259":"药明康德","002230":"科大讯飞","601211":"国泰君安",
    "600196":"复星医药","600547":"山东黄金","601985":"中国核电","601601":"中国太保",
    "601688":"华泰证券","600048":"保利发展","600600":"青岛啤酒","000538":"云南白药",
    "601138":"工业富联","600016":"民生银行",
  };

  let currentWatchlist = [];
  let latestSignals = {};

  function setApiStatus(online) {
    statusDot.className = "status-dot " + (online ? "online" : "offline");
    apiStatus.textContent = online ? "已连接" : "静态模式";
    actionsBar.style.display = online ? "flex" : "none";
  }

  function signalBadge(signal) {
    const bucket = signal.includes("buy") || signal === "bullish" ? "bullish" :
                   signal.includes("sell") || signal === "bearish" ? "bearish" : "neutral";
    return bucket;
  }

  function renderTable() {
    if (currentWatchlist.length === 0) {
      tableWrap.style.display = "none";
      emptyState.style.display = "block";
      wlCount.textContent = "0";
      return;
    }
    tableWrap.style.display = "block";
    emptyState.style.display = "none";
    wlCount.textContent = currentWatchlist.length;

    body.innerHTML = currentWatchlist.map(item => {
      const sig = latestSignals[item.code] || {};
      const signal = sig.final_signal || "hold";
      const score = sig.final_score != null ? sig.final_score : 0;
      const label = sig.signal_label || "⚪ 观望";
      const bucket = signalBadge(signal);

      return `<tr data-code="${item.code}">
        <td class="stock-code"><a class="stock-link" href="../app/stock.html?code=${item.code}">${item.code}</a></td>
        <td>${item.name}</td>
        <td><span class="sentiment-badge ${bucket}">${label}</span></td>
        <td style="font-family:var(--font-mono);color:${score >= 0 ? 'var(--signal-bull)' : 'var(--signal-bear)'}">${score >= 0 ? '+' : ''}${Number(score).toFixed(3)}</td>
        <td>${API ? `<button class="rm-btn" data-code="${item.code}">删除</button>` : ""}</td>
      </tr>`;
    }).join("");

    body.querySelectorAll(".rm-btn").forEach(btn => {
      btn.addEventListener("click", () => removeStock(btn.dataset.code));
    });
  }

  async function loadWatchlist() {
    if (API) {
      try {
        const res = await fetch(`${API}/api/watchlist`);
        if (res.ok) {
          const data = await res.json();
          currentWatchlist = (data.stocks || []).map(s => ({ code: s.code, name: s.name }));
          setApiStatus(true);
          renderTable();
          loadSignals();
          return;
        }
      } catch (e) {}
    }
    setApiStatus(false);
    try {
      const res = await fetch("../data/latest.json");
      const data = await res.json();
      currentWatchlist = (data.stocks || []).map(s => ({ code: s.code, name: s.name }));
      renderTable();
    } catch (_) {
      currentWatchlist = [];
      renderTable();
    }
  }

  async function loadSignals() {
    if (!API) return;
    try {
      const res = await fetch(`${API}/site/latest.json`);
      if (res.ok) {
        const data = await res.json();
        (data.stocks || []).forEach(s => {
          latestSignals[s.code] = {
            final_signal: s.overall_sentiment || "hold",
            final_score: s.signal_breakdown ? s.signal_breakdown.final_score : 0,
            signal_label: s.overall_focus || "⚪ 观望",
          };
        });
        renderTable();
      }
    } catch (_) {}
  }

  async function removeStock(code) {
    if (!API) return;
    await fetch(`${API}/api/watchlist/${code}`, { method: "DELETE" });
    currentWatchlist = currentWatchlist.filter(i => i.code !== code);
    renderTable();
  }

  async function addStock(code, name) {
    if (!API) { alert("静态模式下无法添加，请启动 API 服务"); return; }
    const resolvedName = name || STOCK_DB[code] || code;
    await fetch(`${API}/api/watchlist`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, name: resolvedName }),
    });
    currentWatchlist.push({ code, name: resolvedName });
    renderTable();
    searchInput.value = "";
    searchResults.style.display = "none";
  }

  // Search
  let searchTimeout;
  searchInput.addEventListener("input", function () {
    clearTimeout(searchTimeout);
    const q = this.value.trim();
    if (!q) { searchResults.style.display = "none"; return; }
    searchTimeout = setTimeout(() => {
      const results = Object.entries(STOCK_DB).filter(([code, name]) =>
        code.includes(q) || name.includes(q)
      ).slice(0, 10);

      if (results.length === 0) {
        if (/^\d{6}$/.test(q)) {
          searchResults.innerHTML = `<div class="item" data-code="${q}" data-name="${q}"><span class="code">${q}</span><span class="name">直接添加</span></div>`;
          searchResults.style.display = "block";
        } else { searchResults.style.display = "none"; }
        return;
      }

      searchResults.innerHTML = results.map(([code, name]) => {
        const inWl = currentWatchlist.some(i => i.code === code);
        return `<div class="item" data-code="${code}" data-name="${name}">
          <span class="code">${code}</span>
          <span class="name">${name}${inWl ? " (已在自选)" : ""}</span>
        </div>`;
      }).join("");
      searchResults.style.display = "block";

      searchResults.querySelectorAll(".item").forEach(item => {
        if (currentWatchlist.some(i => i.code === item.dataset.code)) {
          item.style.opacity = "0.4";
          item.style.pointerEvents = "none";
        } else {
          item.addEventListener("click", () => {
            if (API) {
              addStock(item.dataset.code, item.dataset.name);
            } else {
              currentWatchlist.push({ code: item.dataset.code, name: item.dataset.name });
              renderTable();
              searchInput.value = "";
              searchResults.style.display = "none";
            }
          });
        }
      });
    }, 200);
  });

  document.getElementById("btn-add").addEventListener("click", () => {
    const val = searchInput.value.trim();
    if (!val) return;
    if (/^\d{6}$/.test(val)) { addStock(val, STOCK_DB[val] || val); }
    else {
      const found = Object.entries(STOCK_DB).find(([code, name]) => name.includes(val));
      if (found) addStock(found[0], found[1]);
    }
  });

  document.getElementById("btn-import")?.addEventListener("click", async () => {
    if (API) { await fetch(`${API}/api/watchlist/import-default`, { method: "POST" }); loadWatchlist(); }
  });

  document.getElementById("btn-clear")?.addEventListener("click", async () => {
    if (!confirm("确定要清空所有自选股吗？")) return;
    for (const item of [...currentWatchlist]) { await fetch(`${API}/api/watchlist/${item.code}`, { method: "DELETE" }); }
    currentWatchlist = [];
    renderTable();
  });

  document.getElementById("btn-analyze")?.addEventListener("click", async () => {
    if (!API) return;
    const jobStatus = document.getElementById("job-status");
    jobStatus.classList.add("active");
    document.getElementById("job-title").textContent = "盘后分析中...";
    document.getElementById("job-msg").textContent = "正在启动分析任务";
    try {
      const res = await fetch(`${API}/api/jobs`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "post", mode: "full", publish: true }),
      });
      const data = await res.json();
      pollJob(data.job_id);
    } catch (e) { document.getElementById("job-msg").textContent = "启动失败: " + e.message; }
  });

  document.getElementById("btn-analyze-fast")?.addEventListener("click", async () => {
    if (!API) return;
    const jobStatus = document.getElementById("job-status");
    jobStatus.classList.add("active");
    document.getElementById("job-title").textContent = "快速分析中...";
    document.getElementById("job-msg").textContent = "仅计算硬信号（无 LLM）";
    try {
      const res = await fetch(`${API}/api/jobs`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "post", mode: "fast", publish: false }),
      });
      const data = await res.json();
      pollJob(data.job_id);
    } catch (e) { document.getElementById("job-msg").textContent = "启动失败: " + e.message; }
  });

  async function pollJob(jobId) {
    const interval = setInterval(async () => {
      try {
        const res = await fetch(`${API}/api/jobs/${jobId}`);
        const job = await res.json();
        const pct = Math.round((job.progress || 0) * 100);
        document.getElementById("job-bar-fill").style.width = pct + "%";
        document.getElementById("job-pct").textContent = pct + "%";
        document.getElementById("job-msg").textContent = job.message || "";
        if (job.status === "completed" || job.status === "failed") {
          clearInterval(interval);
          document.getElementById("job-title").textContent = job.status === "completed" ? "✅ 分析完成" : "❌ 分析失败";
          setTimeout(() => { jobStatus.classList.remove("active"); loadWatchlist(); }, 3000);
        }
      } catch (_) { clearInterval(interval); }
    }, 2000);
  }

  document.addEventListener("click", (e) => { if (!e.target.closest(".input-wrap")) { searchResults.style.display = "none"; } });

  loadWatchlist();
})();
</script>
</body>
</html>

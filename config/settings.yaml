llm:
  mode: "fallback"             # "fallback" | "concurrent"
  max_retries: 2

  providers:
    - name: "deepseek"
      base_url: "https://api.deepseek.com"
      api_key_env: "DEEPSEEK_API_KEY"
      model: "deepseek-v4-flash"
      temperature: 0.3
      max_tokens: 1024
      timeout: 60
      priority: 1

    - name: "dashscope"
      base_url: "https://coding.dashscope.aliyuncs.com/v1"
      api_key_env: "DASHSCOPE_API_KEY"
      model: "qwen3.6-plus"
      temperature: 0.3
      max_tokens: 1024
      timeout: 60
      priority: 2

schedule:
  pre_market: "08:30"
  post_market: "16:00"
  timezone: "Asia/Shanghai"

notify:
  type: "wecom"
  wecom_webhook: "${WECOM_WEBHOOK}"

data:
  bar_count: 60
  announcement_days: 7
  retry: 1
  retry_delay: 1

report:
  include_market_overview: true
  output_dir: "output/reports"

site:
  output_dir: "site"
  archive_dir: "site/archive"
  data_dir: "site/data"

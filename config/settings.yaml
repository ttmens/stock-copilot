llm:
  mode: "fallback"
  max_retries: 2

  providers:
    - name: "deepseek"
      base_url: "https://api.deepseek.com"
      api_key_env: "DEEPSEEK_API_KEY"
      model: "deepseek-v4-flash"
      temperature: 0.3
      max_tokens: 1024
      timeout: 60
      priority: 1

    - name: "dashscope"
      base_url: "https://coding.dashscope.aliyuncs.com/v1"
      api_key_env: "DASHSCOPE_API_KEY"
      model: "qwen3.6-plus"
      temperature: 0.3
      max_tokens: 1024
      timeout: 60
      priority: 2

schedule:
  pre_market: "08:30"
  post_market: "16:00"
  timezone: "Asia/Shanghai"
  intraday_hours: [10, 11, 14]
  evolution: "16:00"
  db_cleanup: "23:00"
  db_cleanup_dow: "sun"

evolution:
  enabled: true
  auto_mutate_watchlist: false
  auto_apply_weights: false

pipeline:
  llm_concurrency: 2
  batch_size: 25
  skip_stock_html: true
  api_port: 8000
  api_host: "0.0.0.0"

api:
  cors_origins:
    - "https://ttmens.github.io"
    - "http://127.0.0.1:8000"
    - "http://localhost:8000"
  auth_token_env: "STOCK_COPILOT_TOKEN"

notify:
  type: "wecom"
  wecom_webhook: "${WECOM_WEBHOOK}"

data:
  bar_count: 60
  announcement_days: 7
  retry: 1
  retry_delay: 1

report:
  include_market_overview: true
  output_dir: "output/reports"

site:
  output_dir: "site"
  archive_dir: "site/archive"
  data_dir: "site/data"

phase_g:
  enabled: true
  mcap_limit_yi: 3000
  limit_up_streak_days: 3
  production_api_base: ""
  schedule:
    daily_intelligence: "06:30"
    overnight_futures: "06:45"
    recommendation_pool: "08:45"
    recommendation_review: "17:00"
    auction_start: "09:15"
    auction_end: "09:25"
    intraday_interval_min: 2

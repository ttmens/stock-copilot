name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint with ruff
        run: |
          ruff check src/ --select E,F,W --ignore E501,W293
          ruff format --check src/

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Check import structure
        run: |
          python -c "from src.config import get_settings; print('config OK')"
          python -c "from src.data.signal_fusion import fuse_signals; print('fusion OK')"
          python -c "from src.agents.debate import run_debate; print('debate OK')"
